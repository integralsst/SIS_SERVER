name: 5G Backend CI

on:
  push:
    branches:
      - feat/5g-a-continuidad-temporal
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: mysql://stack44:stack44@127.0.0.1:3306/stack44_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
