name: 5G Apply Temporal Detail Patch

on:
  push:
    branches:
      - feat/5g-a-continuidad-temporal

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'chore(5g): apply temporal detail patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded patch
        run: python .github/scripts/patch-5g-detail-temporal.py
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/evaluacion/detalle-aspecto-rapido.service.ts \
                  src/services/evaluacion/detalle-aspecto-secciones.service.ts \
                  src/services/evaluacion/detalle-borrador-seleccionado.service.ts \
                  src/controllers/evaluacion/detalle-aspecto.controller.ts
          git commit -m "chore(5g): apply temporal detail patch"
          git push
