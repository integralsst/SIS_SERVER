name: 5G Patch Legacy Detail

on:
  push:
    branches:
      - feat/5g-a-continuidad-temporal

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: mysql://stack44:stack44@127.0.0.1:3306/stack44_ci
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded patch
        run: python .github/scripts/patch-5g-legacy-detail.py
      - run: npm ci
      - run: npm run build
      - name: Commit source only after successful build
        run: |
          if git diff --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/evaluacion/detalle-aspecto.service.ts
          git commit -m "feat(5g): align legacy detail with temporal continuity"
          git push
