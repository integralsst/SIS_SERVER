name: 5G Fix Detail Compile

on:
  push:
    branches:
      - feat/5g-a-continuidad-temporal

permissions:
  contents: write

jobs:
  fix:
    if: "github.event.head_commit.message != 'chore(5g): fix temporal detail compile'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fix legacy detail calls
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/services/evaluacion/detalle-aspecto-secciones.service.ts')
          text = path.read_text(encoding='utf-8')

          pattern = r'buscarUltimaFinalizada\(\s*empresaId,\s*tarea\.aspectoId,\s*tarea\.aspecto\.codigo\s*\)'
          replacement = '''buscarUltimaFinalizada(
                    empresaId,
                    tarea.aspectoId,
                    tarea.aspecto.identidadHistorica,
                    tarea.aspecto.codigo,
                    construirCorteAnual(anio)
                  )'''
          text, count = re.subn(pattern, replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'llamada legacy última evaluación: {count}')

          marker = '  obtenerRevisionTecnica: async ('
          before, revision = text.split(marker, 1)
          pattern = r'filtroAspectoHistorico\(\s*tarea\.aspectoId,\s*tarea\.aspecto\.codigo\s*\)'
          replacement = '''filtroAspectoHistorico(
              tarea.aspectoId,
              tarea.aspecto.identidadHistorica,
              tarea.aspecto.codigo
            )'''
          revision, count = re.subn(pattern, replacement, revision, count=1)
          if count != 1:
              raise SystemExit(f'filtro legacy revisión: {count}')

          pattern = r'(gestion:\s*\{\s*empresaPeriodo:\s*\{\s*empresaId,\s*\},)(\s*OR:\s*\[)'
          replacement = r'\1\n              fechaGestion: {\n                lte: construirCorteAnual(anio),\n              },\2'
          revision, count = re.subn(pattern, replacement, revision, count=1)
          if count != 1:
              raise SystemExit(f'corte legacy revisión: {count}')

          path.write_text(before + marker + revision, encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/evaluacion/detalle-aspecto-secciones.service.ts
          git commit -m "chore(5g): fix temporal detail compile"
          git push
